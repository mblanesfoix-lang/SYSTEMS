<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S-NFI Systems</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="icon" type="image/png" href="/assets/logo-snfi.png">
  <style>
    :root {
      --bg: #050607;
      --bg-2: #0a0c0e;
      --ink: #f5f6f7;
      --ink-soft: rgba(245,246,247,0.56);
      --ink-dim: rgba(245,246,247,0.44);
      --line: rgba(255,255,255,0.09);
      --line-soft: rgba(255,255,255,0.06);
      --accent: #3dffd2;
      --accent-dim: rgba(61,255,210,0.5);
      --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      font-family: var(--font-body);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    body { overflow: hidden; }

    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
    }
    @media (max-width: 880px) {
      .stage { grid-template-columns: 1fr; grid-template-rows: 44vh 1fr; }
    }

    /* ---------- Hero (left) ---------- */
    .hero {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse 70% 60% at 50% 46%, rgba(61,255,210,0.08) 0%, transparent 65%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(ellipse 60% 55% at 50% 46%, #000 0%, transparent 72%);
      -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 46%, #000 0%, transparent 72%);
    }
    #heroCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .hero-copy {
      position: relative;
      z-index: 2;
      text-align: center;
      pointer-events: none;
      padding: 0 40px;
      transform: translateY(19%);
    }
    .hero-copy .mark {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.02em;
      color: var(--accent-dim);
      opacity: 0;
      animation: rise 0.8s 0.9s var(--ease) forwards;
    }
    /* ---- marca de portada: letras cromadas sobre halo grafito/rojo AMG ----
       El halo va en ::before (capa propia, desenfocada) en vez de en
       text-shadow: asi el resplandor no ensucia el filo de las letras,
       que deben leerse como metal pulido. Paleta de presentacion (grafito +
       rojo AMG), no neon: contenida, seria, sin gritar. */
    .hero-mark {
      position: relative;
      display: inline-block;
    }
    .hero-mark::before {
      content: '';
      position: absolute;
      left: 50%; top: 50%;
      width: 165%; height: 260%;
      transform: translate(-50%, -50%);
      background: radial-gradient(
        ellipse at center,
        rgba(180, 24, 24, 0.16) 0%,
        rgba(120, 20, 20, 0.08) 40%,
        rgba(80, 16, 16, 0.03) 65%,
        rgba(80, 16, 16, 0) 80%
      );
      filter: blur(18px);
      pointer-events: none;
      z-index: -1;
      animation: neonBreath 6.5s ease-in-out infinite;
    }
    .hero-copy h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      text-indent: 0.5em; /* compensa el tracking para que quede centrado */
      line-height: 1.2;
      /* cromado: degradado plateado frio, recortado sobre el texto */
      background: linear-gradient(
        160deg,
        #ffffff 0%, #d8dee4 22%, #9aa4ad 40%,
        #f2f5f7 52%, #aab3bb 68%, #dfe5ea 84%, #8f989f 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.55));
    }
    /* Reserva: si el navegador no recorta degradado sobre texto, el color
       plano evita que el titulo quede invisible. */
    @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
      .hero-copy h1 { color: #dfe5ea; -webkit-text-fill-color: #dfe5ea; }
    }
    .hero-copy h1 .cmark {
      font-size: 0.62em;
      letter-spacing: 0.06em;
      vertical-align: super;
      opacity: 0.75;
    }
    @keyframes neonBreath {
      0%, 100% { opacity: 0.72; }
      50%      { opacity: 1; }
    }
    .hero-copy p {
      margin: 12px auto 0;
      max-width: 380px;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--ink-soft);
      font-weight: 300;
      opacity: 0;
      animation: rise 0.8s 1.2s var(--ease) forwards;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 880px) {
      .hero-copy { transform: translateY(30%); padding: 0 24px; }
      .hero-copy p { display: none; }
    }

    /* ---------- Panel (right) ---------- */
    .panel {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-2);
      border-left: 1px solid var(--line-soft);
    }
    .panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(255,255,255,0.03) 0%, transparent 60%);
      pointer-events: none;
    }
    @media (max-width: 880px) { .panel { border-left: none; border-top: 1px solid var(--line-soft); } }

    .card {
      position: relative;
      z-index: 2;
      width: min(340px, calc(100vw - 56px));
      opacity: 0;
      transform: translateY(10px);
      animation: cardIn 0.7s 0.35s var(--ease) forwards;
    }
    .card.leaving { opacity: 0; transform: translateY(-6px); transition: opacity 0.5s var(--ease), transform 0.5s var(--ease); }
    @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

    .card .kicker {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.02em;
      color: var(--ink-dim);
    }
    .card h2 {
      margin: 8px 0 32px;
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--ink);
    }

    .field { margin-bottom: 12px; }
    .field-label {
      display: block;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.76rem;
      letter-spacing: -0.005em;
      color: var(--ink-dim);
      margin-bottom: 7px;
    }
    .field-wrap {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 10px;
      transition: border-color 0.2s var(--ease), background 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }
    .field-wrap:focus-within {
      border-color: var(--accent-dim);
      background: rgba(255,255,255,0.045);
      box-shadow: 0 0 0 3px rgba(61,255,210,0.08);
    }
    .field-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      padding: 13px 14px;
      font-family: var(--font-body);
      font-size: 0.92rem;
      font-weight: 400;
      color: var(--ink);
      caret-color: var(--accent);
      width: 100%;
      box-sizing: border-box;
    }
    .field-input::placeholder { color: var(--ink-dim); }
    .field-input:-webkit-autofill,
    .field-input:-webkit-autofill:hover,
    .field-input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--ink);
      -webkit-box-shadow: 0 0 0 1000px #0d1012 inset;
      caret-color: var(--accent);
      border-radius: 10px;
      transition: background-color 9999s ease-in-out 0s;
    }

    .submit {
      width: 100%;
      margin-top: 20px;
      padding: 13px 0;
      border: none;
      border-radius: 10px;
      background: var(--ink);
      color: var(--bg);
      font-family: var(--font-body);
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: -0.005em;
      cursor: pointer;
      transition: opacity 0.2s var(--ease), transform 0.15s var(--ease);
    }
    .submit:hover:not(:disabled) { opacity: 0.88; }
    .submit:active:not(:disabled) { transform: scale(0.99); }
    .submit:disabled { opacity: 0.45; cursor: default; }

    .err {
      min-height: 16px;
      margin: 12px 0 0;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: #ff6b5e;
      letter-spacing: 0.02em;
    }

    .card-foot {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--line-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.01em;
      color: var(--ink-dim);
    }
    .card-foot .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      display: inline-block;
      margin-right: 7px;
      vertical-align: middle;
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ---------- Exit fade ---------- */
    .fade {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: var(--bg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s var(--ease);
    }
    .fade.on { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      #heroCanvas { display: none; }
      .hero-copy .mark, .hero-copy h1, .hero-copy p, .card { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <section class="hero" aria-hidden="true">
      <canvas id="heroCanvas"></canvas>
      <div class="hero-copy">
        <h1 class="hero-mark">S-NFI</h1>
      </div>
    </section>

    <section class="panel">
      <div class="card" id="loginCard">
        <form id="loginForm" autocomplete="off">
          <div class="field">
            <label class="field-label" for="username">Usuario</label>
            <div class="field-wrap">
              <input class="field-input" id="username" name="username" type="email" placeholder="usuario@empresa.com" required autocomplete="username" spellcheck="false">
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="password">Contraseña</label>
            <div class="field-wrap">
              <input class="field-input" id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
          </div>
          <button class="submit" type="submit" id="submitBtn">Entrar</button>
          <p class="err" id="err"></p>
        </form>
        <div class="card-foot">
          <span><span class="dot"></span>Enlace seguro</span>
        </div>
      </div>
    </section>
  </div>

  <div class="fade" id="fadeLayer" aria-hidden="true"></div>

  <script type="module" src="/js/pages/login-hero.js"></script>

  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
