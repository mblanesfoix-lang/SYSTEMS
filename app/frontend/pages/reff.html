<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SYSTEMS · Rëff</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/theme.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('systemsTheme');
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/png" href="/assets/logo-snfi.png">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    .reff-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 60% at 60% 40%, rgba(0,113,227,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 85% 90%, rgba(0,113,227,0.04) 0%, transparent 55%),
        radial-gradient(ellipse 40% 40% at 0% 100%, rgba(216,3,0,0.03) 0%, transparent 60%),
        linear-gradient(180deg, var(--bg-elevated) 0%, var(--bg-void) 100%);
    }
    .reff-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 52px;
      min-height: 52px;
      background: var(--glass-strong);
      backdrop-filter: saturate(140%) blur(18px);
      -webkit-backdrop-filter: saturate(140%) blur(18px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }
    .reff-nav .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-primary);
      cursor: pointer;
    }
    .reff-nav .brand .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 12px var(--accent-green);
      animation: pulse 2s ease-in-out infinite;
    }
    .reff-nav .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }
    .reff-nav .breadcrumb .sep {
      opacity: 0.35;
    }
    .reff-nav .breadcrumb .active {
      color: var(--text-primary);
      font-weight: 600;
    }
    .reff-nav .breadcrumb a {
      color: inherit;
      text-decoration: none;
    }
    .reff-nav .breadcrumb a:hover {
      color: var(--text-primary);
    }
    .reff-nav .controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .reff-nav .controls .mono {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }
    .reff-frame-wrapper {
      flex: 1;
      min-height: 0;
      position: relative;
      opacity: 0;
      animation: reveal 0.5s 0.15s var(--ease) forwards;
    }
    .reff-frame-wrapper::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
      opacity: 0.35;
      z-index: 2;
      pointer-events: none;
      animation: metric-sweep 6s ease-in-out infinite;
    }
    .reff-frame-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .reff-offline {
      display: none;
      position: absolute;
      inset: 0;
      background: var(--bg-void);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 10;
    }
    .reff-offline.visible {
      display: flex;
    }
    .reff-offline .mono {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.7;
      letter-spacing: 0.02em;
    }
    .reff-offline h3 {
      font-family: var(--font-display);
      font-size: 1.1rem;
      margin: 0;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }
    .reff-offline code {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border-mid);
      padding: 2px 7px;
      color: var(--accent-blue-text);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      display: inline-block;
      flex-shrink: 0;
    }
    .status-dot.online {
      background: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green);
    }
    .status-dot.offline {
      background: var(--amg-red);
    }

    @media (max-width: 760px) {
      .reff-nav { padding: 0 14px; gap: 8px; }
      .reff-nav .breadcrumb { display: none; }
      .reff-nav .controls #backBtn { padding: 0 10px !important; font-size: 0.66rem !important; }
    }
  </style>
</head>
<body>
  <div class="reff-layout">
    <div class="reff-nav">
      <div class="brand" id="brandLogo">
        <div class="dot"></div>
        <span class="brand-mark">S-NFI Systems (c)</span>
      </div>
      <div class="breadcrumb">
        <a href="/pages/reff-dashboard.html">Rëff</a>
        <span class="sep">/</span>
        <span class="active">Mesa Rëff</span>
        <span class="sep">·</span>
        <span class="status-dot" id="statusDot"></span>
        <span id="statusLabel">comprobando...</span>
      </div>
      <div class="controls">
        <button class="btn btn--ghost" id="backBtn" style="font-size:0.72rem;padding:0 14px;height:32px;">&lt; Dashboard</button>
        <div class="user-menu" id="userMenu">
          <button class="user-menu__trigger mono" id="userTag" aria-haspopup="true" aria-expanded="false">…</button>
          <div class="user-menu__dropdown" id="userDropdown" hidden>
            <div class="user-menu__section">
              <span class="user-menu__label">Cambiar contraseña</span>
              <input class="user-menu__input" type="password" id="pwdCurrent" placeholder="Contraseña actual" autocomplete="current-password">
              <input class="user-menu__input" type="password" id="pwdNew" placeholder="Nueva contraseña" autocomplete="new-password">
              <input class="user-menu__input" type="password" id="pwdConfirm" placeholder="Confirmar nueva" autocomplete="new-password">
              <p class="user-menu__error" id="pwdError" hidden></p>
              <button class="btn sage" id="pwdSubmit" style="width:100%;margin-top:4px;">Actualizar</button>
            </div>
            <div class="user-menu__divider"></div>
            <button class="user-menu__item user-menu__item--danger" id="logoutBtn">Cerrar sesión</button>
          </div>
        </div>
      </div>
    </div>
    <div class="reff-frame-wrapper">
      <div class="reff-offline" id="offlineMsg">
        <h3>Rëff no disponible</h3>
        <p class="mono">
          El servidor Elvi-Ra no está corriendo o Rëff no pudo cargarse.<br>
          Arráncalo con:<br><br>
          <code>cd "app/backend"</code><br>
          <code>node server.js</code>
        </p>
        <button class="btn" id="retryBtn">Reintentar</button>
      </div>
      <iframe id="reffFrame" src="/reff" title="Rëff CRM" allow="clipboard-write"></iframe>
    </div>
  </div>

  <script type="module">
    import { getUser, clearSession, requireAuth, api, getToken, toast } from '/js/api.js';
    import { mountThemeToggle } from '/js/theme.js';
    import { mountAdminNotifications } from '/js/notifications.js';
    requireAuth();
    mountThemeToggle(document.querySelector('.reff-nav .controls') || document.querySelector('.reff-nav'));
    mountAdminNotifications(document.querySelector('.reff-nav .controls'));

    // Mesa guard
    await fetch('/api/me/permissions', { headers: { Authorization: `Bearer ${getToken()}` } })
      .then(r => r.json())
      .then(p => { if (!(p.mesas || []).includes('reff')) location.href = '/pages/dashboard.html'; })
      .catch(() => {});

    const user = getUser() || '';
    document.getElementById('userTag').textContent = user;

    document.getElementById('brandLogo').addEventListener('click', () => {
      location.href = '/pages/reff-dashboard.html';
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      location.href = '/pages/reff-dashboard.html';
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try { await api.logout(); } catch {}
      clearSession();
      location.href = '/pages/login.html';
    });

    // User menu dropdown
    const userMenuTrigger = document.getElementById('userTag');
    const userMenuDropdown = document.getElementById('userDropdown');
    userMenuTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = !userMenuDropdown.hidden;
      userMenuDropdown.hidden = open;
      userMenuTrigger.setAttribute('aria-expanded', String(!open));
    });
    document.addEventListener('click', (e) => {
      if (!document.getElementById('userMenu').contains(e.target)) {
        userMenuDropdown.hidden = true;
        userMenuTrigger.setAttribute('aria-expanded', 'false');
      }
    });
    document.getElementById('pwdSubmit').addEventListener('click', async () => {
      const cur = document.getElementById('pwdCurrent').value;
      const neu = document.getElementById('pwdNew').value;
      const con = document.getElementById('pwdConfirm').value;
      const errEl = document.getElementById('pwdError');
      errEl.hidden = true;
      if (!cur || !neu || !con) { errEl.textContent = 'Rellena todos los campos'; errEl.hidden = false; return; }
      if (neu !== con) { errEl.textContent = 'Las contraseñas no coinciden'; errEl.hidden = false; return; }
      try {
        await api.changePassword(cur, neu);
        toast('Contraseña actualizada');
        userMenuDropdown.hidden = true;
        userMenuTrigger.setAttribute('aria-expanded', 'false');
        ['pwdCurrent','pwdNew','pwdConfirm'].forEach(id => document.getElementById(id).value = '');
      } catch (ex) {
        errEl.textContent = ex.message || 'Error al cambiar contraseña';
        errEl.hidden = false;
      }
    });

    const frame = document.getElementById('reffFrame');
    const offlineMsg = document.getElementById('offlineMsg');
    const statusDot = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');

    async function checkReff() {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 3000);
      try {
        const r = await fetch('/reff/api/health', { signal: controller.signal });
        clearTimeout(timer);
        if (r.ok) {
          statusDot.className = 'status-dot online';
          statusLabel.textContent = 'Rëff activo';
          offlineMsg.classList.remove('visible');
          frame.style.display = 'block';
          return true;
        }
      } catch {
        clearTimeout(timer);
      }
      statusDot.className = 'status-dot offline';
      statusLabel.textContent = 'Rëff offline';
      offlineMsg.classList.add('visible');
      frame.style.display = 'none';
      return false;
    }

    document.getElementById('retryBtn').addEventListener('click', () => {
      statusLabel.textContent = 'comprobando...';
      statusDot.className = 'status-dot';
      checkReff();
    });

    checkReff();
    setInterval(checkReff, 30000);
  </script>
</body>
</html>
