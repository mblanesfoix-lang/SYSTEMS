# Plantilla: copiar a 02-secrets.yaml (ignorado por git) y sustituir los valores.
# Nunca versionar 02-secrets.yaml con valores reales. En producción, mejor
# sellarlo (kubeseal) o usar el gestor de secretos de la plataforma.
# Los valores "CAMBIAR" son obligatorios: el servidor no arranca mientras alguno
# siga así. Las contraseñas SEED_* y REFF_SEED_* solo hacen falta en el primer
# arranque con la base vacía. Cómo generar cada clave: app/backend/.env.example.
apiVersion: v1
kind: Secret
metadata:
  name: elvira-secrets
  namespace: elvira
type: Opaque
stringData:
  # IA
  ANTHROPIC_API_KEY: ""
  # >>> bloque generado desde app/backend/config.js (npm run config:sync); no editar a mano
  # Claves de firma y cifrado
  JWT_SECRET: "CAMBIAR"
  SENTINEL_FORENSIC_SECRET: "CAMBIAR"
  FL_EXPEDIENTE_ENC_KEY: "CAMBIAR"
  # Usuarios iniciales (solo primer arranque con la base vacía)
  SEED_NOUR_PASSWORD: ""
  SEED_MARC_PASSWORD: ""
  SEED_GONZALO_PASSWORD: ""
  SEED_AMIR_PASSWORD: ""
  SEED_RAY_PASSWORD: ""
  SEED_CELIA_PASSWORD: ""
  SEED_MAITANE_PASSWORD: ""
  SEED_ARKAITZ_PASSWORD: ""
  SEED_OSCAR_PASSWORD: ""
  REFF_SEED_MARC_PASSWORD: ""
  REFF_SEED_NOUR_PASSWORD: ""
  REFF_SEED_AMIR_PASSWORD: ""
  REFF_SEED_GONZALO_PASSWORD: ""
  # Fuentes de datos externas
  ESIOS_API_KEY: ""
  # Systems y enlace Twin
  SYSTEMS_TOKEN: ""
  TWIN_TOKEN: ""
  # CIBE Bunker (tokens firmados de Pactvm Viridi)
  CIBE_PRIVATE_KEY_PEM: ""
  CIBE_PUBLIC_KEY_PEM: ""
  # Rack State (consenso entre racks)
  RACK_SHARED_KEY: ""
  # Rëff: correo de reuniones y tareas programadas
  SMTP_PASS: ""
  # <<< fin del bloque generado
