# ─────────────────────────────────────────────────────────────────────────────
# SYSTEMS · stack de despliegue
# Despliegue: docker compose en un servidor Linux propio (scripts/provision-debian.sh),
# o una plataforma de contenedores que lea este archivo.
#
# Configuración: la lista completa y comentada de variables está en
# app/backend/.env.example. Con docker compose van en un .env en la raíz
# (scripts/setup-env.sh lo crea con las claves ya generadas); una plataforma las
# pide en su panel. Las marcadas ${VAR:?} son obligatorias: sin valor, docker
# compose se niega a arrancar. Al arrancar, el servidor
# vuelve a validarlo todo (formato incluido) y lista lo que falte.
# ─────────────────────────────────────────────────────────────────────────────

services:

  mongo:
    # pin a version exacta (ver k8s/03-mongo.yaml): "7.0" es etiqueta flotante.
    image: mongo:7.0.43
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: elvira
    volumes:
      - mongo-data:/data/db
    expose:
      - "27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")' >/dev/null 2>&1 || exit 1"]
    networks:
      - elvira-net

  # ── Ollama · Motor LLM local (opcional) ────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"
    networks:
      - elvira-net
    # Para GPU NVIDIA en Hetzner dedicado:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── SYSTEMS · Backend + Frontend principal (servicio "elvira": nombre heredado) ─
  elvira:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      # >>> bloque generado desde app/backend/config.js (npm run config:sync); no editar a mano
      # Servidor
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5173
      HOST: ${HOST:-0.0.0.0}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-}
      SHUTDOWN_HARD_MS: ${SHUTDOWN_HARD_MS:-}
      # Base de datos
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/elvira}
      BUS_RETENTION_DAYS: ${BUS_RETENTION_DAYS:-}
      # Claves de firma y cifrado
      JWT_SECRET: ${JWT_SECRET:?}
      SENTINEL_FORENSIC_SECRET: ${SENTINEL_FORENSIC_SECRET:?}
      FL_EXPEDIENTE_ENC_KEY: ${FL_EXPEDIENTE_ENC_KEY:?}
      PACTVM_DATA_KEY: ${PACTVM_DATA_KEY:?}
      # Usuarios iniciales (solo primer arranque con la base vacía)
      SEED_NOUR_PASSWORD: ${SEED_NOUR_PASSWORD:-}
      SEED_MARC_PASSWORD: ${SEED_MARC_PASSWORD:-}
      SEED_GONZALO_PASSWORD: ${SEED_GONZALO_PASSWORD:-}
      SEED_AMIR_PASSWORD: ${SEED_AMIR_PASSWORD:-}
      SEED_RAY_PASSWORD: ${SEED_RAY_PASSWORD:-}
      SEED_CELIA_PASSWORD: ${SEED_CELIA_PASSWORD:-}
      SEED_MAITANE_PASSWORD: ${SEED_MAITANE_PASSWORD:-}
      SEED_ARKAITZ_PASSWORD: ${SEED_ARKAITZ_PASSWORD:-}
      SEED_OSCAR_PASSWORD: ${SEED_OSCAR_PASSWORD:-}
      REFF_SEED_MARC_PASSWORD: ${REFF_SEED_MARC_PASSWORD:-}
      REFF_SEED_NOUR_PASSWORD: ${REFF_SEED_NOUR_PASSWORD:-}
      REFF_SEED_AMIR_PASSWORD: ${REFF_SEED_AMIR_PASSWORD:-}
      REFF_SEED_GONZALO_PASSWORD: ${REFF_SEED_GONZALO_PASSWORD:-}
      # IA
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_URL: ${LLM_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-}
      LLM_PRICE_INPUT_PER_M: ${LLM_PRICE_INPUT_PER_M:-}
      LLM_PRICE_OUTPUT_PER_M: ${LLM_PRICE_OUTPUT_PER_M:-}
      # Fuentes de datos externas
      ESIOS_API_KEY: ${ESIOS_API_KEY:-}
      GRID_AUTOSTART: ${GRID_AUTOSTART:-}
      GRID_WORKER_MAX_OLD_MB: ${GRID_WORKER_MAX_OLD_MB:-}
      GRID_ES_URL: ${GRID_ES_URL:-}
      GRID_PT_URL: ${GRID_PT_URL:-}
      GRID_FR_URL: ${GRID_FR_URL:-}
      GRID_MA_URL: ${GRID_MA_URL:-}
      # Salidas a la red (compuerta de Pactvm Viridi)
      EGRESS_ALLOWLIST: ${EGRESS_ALLOWLIST:-}
      EGRESS_EXTERNAL_LLM_MESAS: ${EGRESS_EXTERNAL_LLM_MESAS:-}
      EGRESS_PUBLIC_WEB_MESAS: ${EGRESS_PUBLIC_WEB_MESAS:-}
      EGRESS_TIMEOUT_MS: ${EGRESS_TIMEOUT_MS:-}
      # Sentinel
      SENTINEL_RISK_COUNTRIES: ${SENTINEL_RISK_COUNTRIES:-}
      SENTINEL_EXTRA_SENSITIVE_PATHS: ${SENTINEL_EXTRA_SENSITIVE_PATHS:-}
      # Systems y enlace Twin
      SYSTEMS_URL: ${SYSTEMS_URL:-}
      SYSTEMS_TOKEN: ${SYSTEMS_TOKEN:-}
      SYSTEMS_TIMEOUT_MS: ${SYSTEMS_TIMEOUT_MS:-}
      ENABLE_TWIN_PORT: ${ENABLE_TWIN_PORT:-false}
      TWIN_PORT: 5174
      TWIN_TOKEN: ${TWIN_TOKEN:-}
      # CIBE Bunker (tokens firmados de Pactvm Viridi)
      CIBE_MODE: ${CIBE_MODE:-auto}
      CIBE_TOKEN_TTL_S: ${CIBE_TOKEN_TTL_S:-}
      CIBE_PRIVATE_KEY_PEM: ${CIBE_PRIVATE_KEY_PEM:-}
      CIBE_PUBLIC_KEY_PEM: ${CIBE_PUBLIC_KEY_PEM:-}
      # Rack State (consenso entre racks)
      RACK_ID: ${RACK_ID:-}
      RACK_PEERS: ${RACK_PEERS:-}
      RACK_SHARED_KEY: ${RACK_SHARED_KEY:-}
      RACK_HEARTBEAT_MS: ${RACK_HEARTBEAT_MS:-}
      RACK_ELECTION_MS_MIN: ${RACK_ELECTION_MS_MIN:-}
      # Rëff: correo de reuniones y tareas programadas
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MEETING_REMINDER_CRON: ${MEETING_REMINDER_CRON:-}
      WATCH_CRON_SCHEDULE: ${WATCH_CRON_SCHEDULE:-}
      # <<< fin del bloque generado
    volumes:
      - elvira-data:/app/backend/data
    ports:
      - "5173:5173"
    # Puerto del enlace Twin (ENABLE_TWIN_PORT=true): solo dentro de elvira-net,
    # nunca publicado en "ports".
    expose:
      - "5174"
    networks:
      - elvira-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"" ]
    # `docker stop` y los redespliegues mandan SIGTERM: mismo apagado ordenado que en k8s
    # (readyz->503, drena conexiones/SSE, flush del bus, cierra Mongo, tope duro interno
    # SHUTDOWN_HARD_MS=25s por defecto). Margen sobre ese tope para no cortar en seco.
    stop_grace_period: 35s

volumes:
  ollama-models:
  elvira-data:
  mongo-data:

networks:
  elvira-net:
    driver: bridge
